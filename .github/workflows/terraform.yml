name: Terraform Platform DEV

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          
       role-to-assume: arn:aws:iam::106552501462:role/github-actions-wordpress-platform
       aws-region: eu-north-1


      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="config/dev.backend"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -var-file="config/dev.tfvars" -out=tfplan

      
