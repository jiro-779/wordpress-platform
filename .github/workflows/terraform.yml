name: Terraform Platform DEV

on:
  push:
    branches:
      - main

  workflow_dispatch:
    inputs:
      action:
        description: "Select Terraform action"
        type: choice
        options:
          - plan
          - apply
          - destroy
        default: plan

permissions:
  id-token: write
  contents: read

concurrency:
  group: terraform-platform-dev
  cancel-in-progress: false

jobs:
  terraform:
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.15.8

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::106552501462:role/github-actions-wordpress-platform
          aws-region: eu-north-1

      - name: Terraform Init
        run: terraform init -reconfigure -backend-config="config/dev.backend"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        if: ${{ github.event_name == 'push' || inputs.action != 'destroy' }}
        run: terraform plan -var-file="config/dev.tfvars" -out=tfplan

      - name: Terraform Apply
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'apply' && github.ref == 'refs/heads/main' }}
        run: terraform apply -auto-approve tfplan

      - name: Terraform Destroy Plan
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && github.ref == 'refs/heads/main' }}
        run: terraform plan -destroy -var-file="config/dev.tfvars" -out=destroy.tfplan

      - name: Terraform Destroy
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.action == 'destroy' && github.ref == 'refs/heads/main' }}
        run: terraform apply -auto-approve destroy.tfplan
